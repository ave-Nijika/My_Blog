version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 在构建期内联，验证码 site key 必须经 build-arg 传入
        NEXT_PUBLIC_CAPTCHA_SITE_KEY: ${NEXT_PUBLIC_CAPTCHA_SITE_KEY:-}
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://bloguser:${POSTGRES_PASSWORD}@postgres:5432/blogdb
      - APP_URL=${APP_URL}
      - IP_HASH_SECRET=${IP_HASH_SECRET}
      - VISITOR_TOKEN_SECRET=${VISITOR_TOKEN_SECRET}
      - ADMIN_LOGIN_PATH=${ADMIN_LOGIN_PATH}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS}
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES}
      - CAPTCHA_ENABLED=${CAPTCHA_ENABLED}
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER}
      - NEXT_PUBLIC_CAPTCHA_SITE_KEY=${NEXT_PUBLIC_CAPTCHA_SITE_KEY}
      - CAPTCHA_SECRET_KEY=${CAPTCHA_SECRET_KEY}
      - CAPTCHA_EXPECTED_HOSTNAME=${CAPTCHA_EXPECTED_HOSTNAME}
      - CAPTCHA_EXPECTED_ACTION=${CAPTCHA_EXPECTED_ACTION}
      - COMMENT_COOLDOWN_SECONDS=${COMMENT_COOLDOWN_SECONDS}
      - COMMENT_MIN_LENGTH=${COMMENT_MIN_LENGTH}
      - COMMENT_MAX_LENGTH=${COMMENT_MAX_LENGTH}
      - COMMENT_BODY_MAX_BYTES=${COMMENT_BODY_MAX_BYTES}
      - COMMENT_AUTO_BAN_THRESHOLD=${COMMENT_AUTO_BAN_THRESHOLD}
      - COMMENT_RATE_LIMIT_WINDOW_SECONDS=${COMMENT_RATE_LIMIT_WINDOW_SECONDS}
      - COMMENT_RATE_LIMIT_MAX_ATTEMPTS=${COMMENT_RATE_LIMIT_MAX_ATTEMPTS}
      - COMMENT_LLM_ENABLED=${COMMENT_LLM_ENABLED}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - COMMENT_LLM_TIMEOUT_MS=${COMMENT_LLM_TIMEOUT_MS}
      - COMMENT_LLM_MAX_RETRIES=${COMMENT_LLM_MAX_RETRIES}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - content-repo:/app/content
      - uploads-data:/app/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=bloguser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=blogdb
    # 审核要点：生产数据库不暴露公网端口（仅容器网络内可达）
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloguser -d blogdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

volumes:
  content-repo:
  uploads-data:
  postgres-data:
